name: Generate emerald contribution snake

on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * *"

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Generate emerald contribution snake
        uses: Platane/snk@v3
        with:
          github_user_name: yaswanth296
          outputs: |
            dist/emerald-contribution-snake.svg?palette=github-green
      - name: Publish SVG to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
